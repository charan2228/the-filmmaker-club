<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TFC Admin</title><link rel="stylesheet" href="style.css"></head>
<body class="admin-page"><header class="admin-header"><div><span class="mini">THE FILMMAKER CLUB</span><h1>Frontend Editor</h1></div><div class="admin-actions"><a href="index.html" class="btn ghost">VIEW WEBSITE</a><button class="btn primary" onclick="saveAllSettings()">SAVE CHANGES</button></div></header>
<main class="admin-shell"><aside class="sidebar"><button class="tab active" data-tab="event">Event</button><button class="tab" data-tab="hero">Hero</button><button class="tab" data-tab="about">About</button><button class="tab" data-tab="branding">Branding</button><button class="tab" data-tab="tickets">Tickets</button><button class="tab" data-tab="data">Data</button></aside>
<section class="admin-content"><div class="notice">Every field below changes the public frontend. Save changes, then refresh the public site.</div>
<div class="panel active" data-panel="event"><h2>Event details</h2><div class="form-grid">
<label>Movie title<input id="cfg_movieTitle"></label><label>Event eyebrow<input id="cfg_eventEyebrow"></label><label>Date<input id="cfg_eventDate"></label><label>Time<input id="cfg_eventTime"></label><label class="wide">Venue<input id="cfg_eventVenue"></label><label>Poster tag<input id="cfg_posterTag"></label><label>Poster year<input id="cfg_posterYear"></label><label class="wide">Poster image URL<input id="cfg_posterImage"></label><label class="wide">Description<textarea id="cfg_eventDescription"></textarea></label></div></div>
<div class="panel" data-panel="hero"><h2>Hero section</h2><div class="form-grid"><label class="wide">Hero kicker<input id="cfg_heroKicker"></label><label class="wide">Hero title<textarea id="cfg_heroTitle"></textarea></label><label class="wide">Hero subtitle<textarea id="cfg_heroSubtitle"></textarea></label><label>Hero date label<input id="cfg_heroDate"></label><label>Hero venue label<input id="cfg_heroVenue"></label><label class="wide">Hero background image URL<input id="cfg_heroBackground"></label><label class="wide">Moving banner text<input id="cfg_marqueeText"></label></div></div>
<div class="panel" data-panel="about"><h2>About & CTA</h2><div class="form-grid"><label class="wide">About title<textarea id="cfg_aboutTitle"></textarea></label><label class="wide">About text<textarea id="cfg_aboutText"></textarea></label><label class="wide">About signature<input id="cfg_aboutSignature"></label><label>CTA kicker<input id="cfg_ctaKicker"></label><label class="wide">CTA title<textarea id="cfg_ctaTitle"></textarea></label></div></div>
<div class="panel" data-panel="branding"><h2>Branding</h2><div class="form-grid"><label class="wide">Site logo text<input id="cfg_siteLogo"></label><label class="wide">Footer text<input id="cfg_footerText"></label><label class="wide">Social label<input id="cfg_footerInstagram"></label><label>Accent color<input type="color" id="cfg_accentColor"></label><label>Background color<input type="color" id="cfg_backgroundColor"></label></div></div>
<div class="panel" data-panel="tickets"><h2>Tickets</h2><div class="form-grid"><label>Price ₹<input type="number" id="cfg_ticketPrice"></label><label>Capacity<input type="number" id="cfg_ticketCapacity"></label><label>Max per booking<input type="number" id="cfg_maxPerBooking"></label><label>Waitlist limit<input type="number" id="cfg_waitlistLimit"></label></div><div class="stats"><div><span>Sold</span><strong id="adminSold">0</strong></div><div><span>Remaining</span><strong id="adminRemaining">0</strong></div><div><span>Waitlist</span><strong id="adminWaitCount">0</strong></div></div></div>
<div class="panel" data-panel="data"><h2>Local demo data</h2><div class="danger"><button class="btn ghost" onclick="downloadConfig()">DOWNLOAD SETTINGS JSON</button><button class="btn ghost" onclick="resetBookings()">RESET BOOKINGS</button><button class="btn ghost" onclick="resetEverything()">RESET EVERYTHING</button></div></div>
<div class="savebar"><span id="saveStatus">Press Save Changes to apply edits.</span><button class="btn primary" onclick="saveAllSettings()">SAVE CHANGES</button></div>
</section></main><script src="app.js"></script></body></html>
